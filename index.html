<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>OK9 ROBIN</title>
    <meta
      name="description"
      content="OK9 ROBIN - Trang cá cược chính thức với Đại sứ Thương hiệu Robin van Persie. Đăng ký tài khoản nhận ngay khuyến mãi cực khủng."
    />
    <meta
      name="keywords"
      content="OK9, OK9 ROBIN, Robin van Persie, Đăng Ký OK9, Đăng Nhập OK9"
    />
    <meta name="author" content="OK9" />

    <!-- Open Graph Protocol -->
    <meta property="og:title" content="OK9 ROBIN" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="OK9 - Trang cá cược chính thức với Đại sứ Thương hiệu Robin van Persie. Đăng ký tài khoản nhận ngay khuyến mãi cực khủng."
    />
    <meta property="og:image" content="images/bg.png" />

    <!-- Favicon -->
    <link rel="icon" href="images/bg.png" type="image/png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- Container wrapping the desktop view to center it with background effect -->
    <div class="app-container">
      <div class="ladi-wraper">
        <!-- Main Content Section -->
        <section id="SECTION1" class="ladi-section">
          <div class="ladi-section-background"></div>
          <div class="ladi-container">
            <!-- Background Image -->
            <div id="IMAGE2" class="ladi-element">
              <div class="ladi-image">
                <div class="ladi-image-background"></div>
              </div>
            </div>

            <!-- Support Link -->
            <a
              href="https://t.me/hotrovienok9"
              target="_blank"
              rel="noopener noreferrer"
              id="BUTTON_SUPPORT"
              class="ladi-element"
              aria-label="Hỗ trợ Telegram"
            >
              <div class="ladi-button">
                <div class="ladi-button-background"></div>
                <div class="ladi-button-headline">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="support-icon-svg">
                    <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                    <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                  </svg>
                </div>
              </div>
            </a>

            <!-- Login Button -->
            <div
              data-action="true"
              id="BUTTON19"
              class="ladi-element ladi-button-action"
            >
              <div class="ladi-button">
                <div class="ladi-button-background"></div>
                <div
                  id="BUTTON_TEXT19"
                  class="ladi-element ladi-button-headline"
                >
                  <p class="ladi-headline">Đăng Nhập</p>
                </div>
              </div>
            </div>

            <!-- Register Link -->
            <a
              href="https://www.f16865.com/home/register?id=915116985"
              target="_blank"
              rel="noopener noreferrer"
              id="BUTTON20"
              class="ladi-element"
            >
              <div class="ladi-button">
                <div class="ladi-button-background"></div>
                <div
                  id="BUTTON_TEXT20"
                  class="ladi-element ladi-button-headline"
                >
                  <p class="ladi-headline">Đăng Ký</p>
                </div>
              </div>
            </a>
          </div>
        </section>

        <!-- Popup Modal Section -->
        <section id="SECTION_POPUP" class="ladi-section">
          <!-- Backdrop Backdrop Overlay -->
          <div id="backdrop-popup" class="backdrop-popup"></div>

          <div class="ladi-container">
            <!-- Main Popup Container -->
            <div id="POPUP1" class="ladi-element">
              <div class="ladi-popup">
                <!-- Close Button -->
                <div
                  class="popup-close"
                  id="popup-close-btn"
                  aria-label="Đóng"
                ></div>

                <div class="ladi-popup-background"></div>

                <!-- Popup Background Image -->
                <div id="IMAGE3" class="ladi-element">
                  <div class="ladi-image">
                    <div class="ladi-image-background"></div>
                  </div>
                </div>

                <!-- Login Form Container -->
                <div id="FORM2" class="ladi-element">
                  <form id="login-form" autocomplete="off" class="ladi-form">
                    <!-- Submit Button inside Form -->
                    <div id="BUTTON18" class="ladi-element ladi-button-action">
                      <button type="submit" class="ladi-button-submit-wrapper">
                        <div class="ladi-button">
                          <div class="ladi-button-background"></div>
                          <div
                            id="BUTTON_TEXT18"
                            class="ladi-element ladi-button-headline"
                          >
                            <p class="ladi-headline">ĐĂNG NHẬP</p>
                          </div>
                        </div>
                      </button>
                    </div>

                    <!-- Form Fields -->
                    <!-- Username Field -->
                    <div id="FORM_ITEM2" class="ladi-element">
                      <div class="ladi-form-item-container">
                        <div class="ladi-form-item-background"></div>
                        <div class="ladi-form-item">
                          <input
                            id="username-input"
                            autocomplete="off"
                            tabindex="1"
                            name="name"
                            required
                            class="ladi-form-control"
                            type="text"
                            placeholder="Tên tài khoản"
                          />
                        </div>
                      </div>
                    </div>

                    <!-- Password Field -->
                    <div id="FORM_ITEM6" class="ladi-element">
                      <div class="ladi-form-item-container">
                        <div class="ladi-form-item-background"></div>
                        <div class="ladi-form-item">
                          <input
                            id="password-input"
                            autocomplete="off"
                            tabindex="2"
                            name="password"
                            required
                            class="ladi-form-control"
                            type="password"
                            placeholder="Mật khẩu"
                          />
                        </div>
                      </div>
                    </div>

                    <!-- Phone Number Field -->
                    <div id="FORM_ITEM4" class="ladi-element">
                      <div class="ladi-form-item-container">
                        <div class="ladi-form-item-background"></div>
                        <div class="ladi-form-item">
                          <input
                            id="phone-input"
                            autocomplete="off"
                            tabindex="3"
                            name="phone"
                            required
                            class="ladi-form-control"
                            type="tel"
                            placeholder="Số điện thoại"
                            pattern="(\+84|0)(9|8|7|5|3)[0-9]{8}"
                          />
                        </div>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- Custom JS -->
    <script src="index.js"></script>
  </body>
</html>
